name: Build and Deploy Frontend to AWS EC2

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: '18'

jobs:
  deploy-dev:
    name: Deploy to Dev Environment
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/dev'
    environment: development
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      env:
        NEXT_PUBLIC_API_URL: http://52.20.22.173
        NEXTAUTH_URL: http://52.20.22.173
        NEXTAUTH_SECRET: /bG5bl9y23JSqYstIc/c+uoY/3eIwlPeInJU9kiJd7I=
      run: npm run build

    - name: Create deployment archive
      run: |
        echo "Creating deployment archive..."
        tar -czf deploy.tar.gz .next public node_modules package.json package-lock.json next.config.ts tsconfig.json

    - name: Copy build to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST_DEV }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: deploy.tar.gz
        target: /tmp

    - name: Deploy on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_DEV }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          # Note: Not using set -e to avoid exit on service stop failures
          
          # Stop existing service
          echo "Stopping frontend service..."
          if sudo systemctl list-unit-files | grep -q academic-frontend.service; then
            sudo systemctl stop academic-frontend 2>/dev/null || true
            sudo systemctl disable academic-frontend 2>/dev/null || true
          fi
          
          # Clean old deployment
          cd /home/ec2-user
          rm -rf academic-saas-frontend-old
          if [ -d academic-saas-frontend ]; then
            mv academic-saas-frontend academic-saas-frontend-old
          fi
          
          # Create new deployment directory
          mkdir -p academic-saas-frontend
          cd academic-saas-frontend
          
          # Extract deployment
          echo "Extracting deployment archive..."
          tar -xzf /tmp/deploy.tar.gz
          rm /tmp/deploy.tar.gz
          
          # Install Node.js if needed
          if [ ! -f /usr/local/bin/node ]; then
            echo "Installing Node.js..."
            cd /tmp
            wget -q https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz
            sudo tar -xf node-v18.20.4-linux-x64.tar.xz -C /usr/local --strip-components=1
            cd /home/ec2-user/academic-saas-frontend
          fi
          
          # Create systemd service
          sudo tee /etc/systemd/system/academic-frontend.service > /dev/null <<EOF
          [Unit]
          Description=Academic SaaS Frontend
          After=network.target
          
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/academic-saas-frontend
          Environment="NODE_ENV=production"
          Environment="PORT=3000"
          Environment="HOSTNAME=0.0.0.0"
          Environment="NEXT_PUBLIC_API_URL=http://52.20.22.173"
          Environment="NEXTAUTH_URL=http://52.20.22.173"
          Environment="NEXTAUTH_SECRET=/bG5bl9y23JSqYstIc/c+uoY/3eIwlPeInJU9kiJd7I="
          ExecStart=/usr/local/bin/npm start
          Restart=always
          RestartSec=10
          StandardOutput=append:/home/ec2-user/academic-saas-frontend/frontend.log
          StandardError=append:/home/ec2-user/academic-saas-frontend/frontend-error.log
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          # Start service
          echo "Starting frontend service..."
          sudo systemctl daemon-reload
          sudo systemctl enable academic-frontend
          sudo systemctl restart academic-frontend
          
          # Verify frontend service
          sleep 15
          if sudo systemctl is-active --quiet academic-frontend; then
            echo "✅ Frontend service is running!"
            
            # Check if frontend responds on port 3000
            MAX_RETRIES=5
            RETRY_COUNT=0
            while [ $RETRY_COUNT -lt $MAX_RETRIES ]; do
              if curl -f http://localhost:3000/ > /dev/null 2>&1; then
                echo "✅ Frontend responding on port 3000"
                echo "Note: Full access via nginx depends on backend deployment"
                exit 0
              fi
              RETRY_COUNT=$((RETRY_COUNT + 1))
              echo "Waiting for frontend to respond... (attempt $RETRY_COUNT/$MAX_RETRIES)"
              sleep 5
            done
            
            echo "⚠️ Frontend service running but not responding after $MAX_RETRIES attempts"
            sudo journalctl -u academic-frontend -n 20
            # Don't fail the deployment, frontend might need more time
            exit 0
          else
            echo "❌ Frontend service failed to start"
            sudo journalctl -u academic-frontend -n 50
            exit 1
          fi

  deploy-prod:
    name: Deploy to Production Environment  
    runs-on: ubuntu-latest
    if: github.ref == 'refs/heads/main'
    environment: production
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Build application
      env:
        NEXT_PUBLIC_API_URL: ${{ secrets.NEXT_PUBLIC_API_URL_PROD }}
        NEXTAUTH_URL: ${{ secrets.NEXTAUTH_URL_PROD }}
        NEXTAUTH_SECRET: ${{ secrets.NEXTAUTH_SECRET }}
      run: npm run build

    - name: Create deployment archive
      run: |
        echo "Creating deployment archive..."
        tar -czf deploy.tar.gz .next public node_modules package.json package-lock.json next.config.ts tsconfig.json

    - name: Copy build to EC2
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.EC2_HOST_PROD }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        source: deploy.tar.gz
        target: /tmp

    - name: Deploy on EC2
      uses: appleboy/ssh-action@master
      with:
        host: ${{ secrets.EC2_HOST_PROD }}
        username: ec2-user
        key: ${{ secrets.EC2_SSH_KEY }}
        script: |
          set -e
          
          # Stop existing service
          echo "Stopping frontend service..."
          sudo systemctl stop academic-frontend || true
          
          # Backup and clean old deployment
          cd /home/ec2-user
          if [ -d academic-saas-frontend ]; then
            cp -r academic-saas-frontend academic-saas-frontend-backup-$(date +%Y%m%d-%H%M%S)
            rm -rf academic-saas-frontend-old
            mv academic-saas-frontend academic-saas-frontend-old
          fi
          
          # Create new deployment directory
          mkdir -p academic-saas-frontend
          cd academic-saas-frontend
          
          # Extract deployment
          echo "Extracting deployment archive..."
          tar -xzf /tmp/deploy.tar.gz
          rm /tmp/deploy.tar.gz
          
          # Install Node.js if needed
          if [ ! -f /usr/local/bin/node ]; then
            echo "Installing Node.js..."
            cd /tmp
            wget -q https://nodejs.org/dist/v18.20.4/node-v18.20.4-linux-x64.tar.xz
            sudo tar -xf node-v18.20.4-linux-x64.tar.xz -C /usr/local --strip-components=1
            cd /home/ec2-user/academic-saas-frontend
          fi
          
          # Create systemd service
          sudo tee /etc/systemd/system/academic-frontend.service > /dev/null <<EOF
          [Unit]
          Description=Academic SaaS Frontend
          After=network.target
          
          [Service]
          Type=simple
          User=ec2-user
          WorkingDirectory=/home/ec2-user/academic-saas-frontend
          Environment="NODE_ENV=production"
          Environment="PORT=3000"
          Environment="HOSTNAME=0.0.0.0"
          Environment="NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL_PROD }}"
          Environment="NEXTAUTH_URL=${{ secrets.NEXTAUTH_URL_PROD }}"
          Environment="NEXTAUTH_SECRET=${{ secrets.NEXTAUTH_SECRET }}"
          ExecStart=/usr/local/bin/npm start
          Restart=always
          RestartSec=10
          StandardOutput=append:/home/ec2-user/academic-saas-frontend/frontend.log
          StandardError=append:/home/ec2-user/academic-saas-frontend/frontend-error.log
          
          [Install]
          WantedBy=multi-user.target
          EOF
          
          # Start service
          echo "Starting frontend service..."
          sudo systemctl daemon-reload
          sudo systemctl enable academic-frontend
          sudo systemctl restart academic-frontend
          
          # Verify
          sleep 10
          if sudo systemctl is-active --quiet academic-frontend; then
            echo "✅ Frontend service is running!"
            echo "URL: http://${{ secrets.EC2_HOST_PROD }}"
          else
            echo "❌ Frontend service failed to start"
            sudo journalctl -u academic-frontend -n 50
            exit 1
          fi